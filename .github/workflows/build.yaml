name: android_build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 防止无限卡死

    steps:
      # 1. 代码检出
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 自动处理子模块

      # 2. JDK 环境配置
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17  # Android Studio 2023+ 推荐 JDK17

      # 3. Gradle 缓存加速（关键优化）
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. 构建环境准备
      - name: Prepare build
        run: |
          # 生成 gradle wrapper（如果缺失）
          if [ ! -f "./gradlew" ]; then
              gradle wrapper --gradle-version 8.5
          fi

          # 替换为阿里云镜像（解决国内依赖下载问题）
          sed -i.bak \
            -e "s/mavenCentral()/maven { url 'https://maven.aliyun.com/repository/public' }/g" \
            -e "s/google()/maven { url 'https://maven.aliyun.com/repository/google' }/g" \
            settings.gradle build.gradle

          chmod +x gradlew

      # 5. 执行构建
      - name: Build with Gradle
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --refresh-dependencies \
            --no-daemon \
            --warning-mode all

      # 6. 上传产物（自动合并多APK）
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-apks
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          retention-days: 7

      # 7. 构建失败时输出日志（调试用）
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            **/build/reports/**/*.*
            **/build/outputs/logs/**/*.*
