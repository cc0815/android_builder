name: android_build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - id: get-project
        name: Get project name
        run: echo "PROJECT=$(cat project-to-build)" >> $GITHUB_OUTPUT

      - name: Clone project
        run: |
          git clone --depth=1 "${{ steps.get-project.outputs.PROJECT }}" project
          # 添加子模块初始化（如果项目有子模块）
          cd project
          git submodule update --init --recursive

      - name: Build the app
        working-directory: ./project
        run: |
          # 强制生成 Gradle Wrapper（避免旧版本问题）
          gradle wrapper --gradle-version 8.5
          
          # 添加阿里云镜像加速依赖下载
          sed -i "s|mavenCentral()|maven { url 'https://maven.aliyun.com/repository/public' }|g" build.gradle
          sed -i "s|google()|maven { url 'https://maven.aliyun.com/repository/google' }|g" build.gradle

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --refresh-dependencies
